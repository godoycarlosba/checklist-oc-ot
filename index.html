<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Checklist OC / OT - Seguimiento</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    margin: 0; padding: 20px; background: #f4f6f9; color: #1f2937;
  }
  .header {
    background: #1F4E78; color: white; padding: 18px 24px; border-radius: 10px;
    margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;
    box-shadow: 0 2px 6px rgba(0,0,0,.08);
  }
  .header h1 { margin: 0; font-size: 22px; }
  .header .sub { font-size: 12px; opacity: .8; margin-top: 4px; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; }
  button {
    border: none; cursor: pointer; padding: 8px 14px; border-radius: 6px;
    font-size: 13px; font-weight: 600; transition: .15s;
  }
  .btn-primary { background: #2563eb; color: white; }
  .btn-primary:hover { background: #1d4ed8; }
  .btn-secondary { background: #e5e7eb; color: #1f2937; }
  .btn-secondary:hover { background: #d1d5db; }
  .btn-danger { background: transparent; color: #dc2626; padding: 4px 8px; }
  .btn-danger:hover { background: #fee2e2; }
  .btn-small { padding: 5px 10px; font-size: 12px; }
  .stats {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px;
  }
  .stat {
    background: white; padding: 12px 16px; border-radius: 8px;
    box-shadow: 0 1px 3px rgba(0,0,0,.05); border-left: 4px solid #1F4E78;
  }
  .stat .num { font-size: 24px; font-weight: 700; color: #1F4E78; }
  .stat .lbl { font-size: 11px; color: #6b7280; text-transform: uppercase; letter-spacing: .5px; }
  .oc {
    background: white; border-radius: 10px; margin-bottom: 14px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06); overflow: hidden;
  }
  .oc-head {
    background: #1F4E78; color: white; padding: 12px 18px;
    display: flex; align-items: center; gap: 12px; cursor: pointer;
  }
  .oc-head .toggle { font-size: 14px; width: 14px; transition: .15s; }
  .oc-head.collapsed .toggle { transform: rotate(-90deg); }
  .oc-head input.title {
    background: transparent; border: none; color: white; font-size: 16px; font-weight: 700;
    flex: 1; padding: 4px 8px; border-radius: 4px;
  }
  .oc-head input.title:focus { background: rgba(255,255,255,.15); outline: none; }
  .oc-head .progress {
    background: rgba(255,255,255,.2); padding: 3px 10px; border-radius: 12px;
    font-size: 12px; font-weight: 600;
  }
  .oc-body { padding: 14px 18px; }
  .oc-body.hidden { display: none; }
  .section-title {
    font-size: 13px; font-weight: 700; color: #1F4E78; text-transform: uppercase;
    letter-spacing: .5px; margin: 12px 0 6px; display: flex; align-items: center; gap: 8px;
  }
  .task-list { list-style: none; padding: 0; margin: 0 0 8px; }
  .task {
    display: flex; align-items: center; gap: 10px; padding: 6px 8px;
    border-radius: 5px; transition: .1s;
  }
  .task:hover { background: #f9fafb; }
  .task input[type="checkbox"] {
    width: 18px; height: 18px; cursor: pointer; accent-color: #2563eb;
  }
  .task input[type="text"] {
    flex: 1; border: none; background: transparent; padding: 4px 6px;
    font-size: 14px; color: #1f2937;
  }
  .task input[type="text"]:focus {
    background: #f3f4f6; outline: none; border-radius: 4px;
  }
  .task.done input[type="text"] { text-decoration: line-through; color: #9ca3af; }
  .task .meta {
    font-size: 11px; color: #6b7280; min-width: 90px; text-align: right;
  }
  .task input[type="date"] {
    border: 1px solid #e5e7eb; border-radius: 4px; padding: 3px 6px; font-size: 12px;
  }
  .task-field {
    display: flex; flex-direction: column; gap: 1px;
  }
  .task-field label {
    font-size: 9px; font-weight: 700; color: #6b7280;
    text-transform: uppercase; letter-spacing: .5px; padding-left: 2px;
  }
  .task-field input[type="text"] {
    border: 1px solid #e5e7eb !important; border-radius: 4px !important;
    padding: 3px 6px !important; font-size: 12px; max-width: 130px;
    background: white !important;
  }
  .task-field input[type="date"] { max-width: 130px; }
  .ot {
    background: #f9fafb; border-left: 3px solid #60a5fa; border-radius: 6px;
    margin: 10px 0; padding: 10px 14px;
  }
  .ot-head {
    display: flex; align-items: center; gap: 10px; margin-bottom: 6px;
  }
  .ot-head input.ot-title {
    flex: 1; border: none; background: transparent; font-size: 14px; font-weight: 700;
    color: #1e3a8a; padding: 3px 6px; border-radius: 4px;
  }
  .ot-head input.ot-title:focus { background: white; outline: 1px solid #60a5fa; }
  .ot-progress {
    background: #dbeafe; color: #1e40af; padding: 2px 8px; border-radius: 10px;
    font-size: 11px; font-weight: 600;
  }
  .ot-fields {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px;
    margin: 6px 0 10px; padding: 8px; background: white;
    border-radius: 6px; border: 1px solid #e5e7eb;
  }
  .ot-field { display: flex; flex-direction: column; gap: 2px; }
  .ot-field label {
    font-size: 10px; font-weight: 700; color: #6b7280;
    text-transform: uppercase; letter-spacing: .5px;
  }
  .ot-field input, .ot-field select {
    border: 1px solid #e5e7eb; border-radius: 4px; padding: 4px 6px;
    font-size: 13px; background: white; width: 100%;
  }
  .ot-field input:focus, .ot-field select:focus {
    outline: none; border-color: #2563eb;
  }
  select.estado-aprob { font-weight: 600; }
  select.estado-aprob.pendiente { color: #6b7280; }
  select.estado-aprob.revision { color: #b45309; background: #fef3c7; }
  select.estado-aprob.aprobado { color: #047857; background: #d1fae5; }
  select.estado-aprob.observado { color: #b45309; background: #ffedd5; }
  select.estado-aprob.rechazado { color: #b91c1c; background: #fee2e2; }
  @media (max-width: 700px) {
    .ot-fields { grid-template-columns: repeat(2, 1fr); }
  }
  .add-row {
    display: flex; gap: 6px; margin-top: 6px;
  }
  .add-row input {
    flex: 1; border: 1px dashed #cbd5e1; border-radius: 4px; padding: 6px 10px;
    font-size: 13px; background: white;
  }
  .add-row input:focus { outline: none; border-color: #2563eb; border-style: solid; }
  .empty {
    text-align: center; padding: 40px; color: #9ca3af; font-size: 14px;
  }
  .footer {
    margin-top: 24px; text-align: center; font-size: 11px; color: #9ca3af;
  }
  @media (max-width: 700px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .task .meta { display: none; }
  }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>📋 Checklist OC / OT</h1>
    <div class="sub">Seguimiento de materiales y tareas — Oil & Gas / Viviendas Modulares</div>
  </div>
  <div class="toolbar">
    <button class="btn-primary" onclick="addOC()">+ Nueva OC</button>
    <button class="btn-secondary" onclick="exportData()">⬇ Exportar</button>
    <button class="btn-secondary" onclick="importData()">⬆ Importar</button>
  </div>
</div>

<div class="stats" id="stats"></div>
<div id="container"></div>

<div class="footer">
  Los datos se guardan automáticamente en tu navegador (este dispositivo).
  Usá <b>Exportar</b> para hacer respaldo a archivo .json.
</div>

<input type="file" id="fileInput" accept=".json" style="display:none" onchange="loadFile(event)">

<script>
const STORAGE_KEY = "checklist_oc_ot_v1";
let data = load();

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function load() {
  try {
    const d = JSON.parse(localStorage.getItem(STORAGE_KEY)) || { ocs: [] };
    // Migración: agregar campos PL AESA, PL Cliente, Estado Aprobación, PIE a OTs antiguas
    const migrateTask = t => {
      if (t.fecha_inicio === undefined) t.fecha_inicio = "";
      if (t.fecha_fin === undefined) t.fecha_fin = t.fecha || "";
      if (t.fecha !== undefined) delete t.fecha;
      if (t.responsable === undefined) t.responsable = "";
    };
    (d.ocs || []).forEach(oc => {
      if (oc.proyecto === undefined) oc.proyecto = "";
      (oc.tareasGenerales || []).forEach(migrateTask);
      (oc.ots || []).forEach(ot => {
        if (ot.pl_aesa === undefined) ot.pl_aesa = "";
        if (ot.pl_cliente === undefined) ot.pl_cliente = "";
        if (ot.estado_aprobacion === undefined) ot.estado_aprobacion = "Pendiente";
        if (ot.pie === undefined) ot.pie = "";
        if (ot.pie_estado_aprobacion === undefined) ot.pie_estado_aprobacion = "Pendiente";
        (ot.tareas || []).forEach(migrateTask);
      });
    });
    return d;
  } catch { return { ocs: [] }; }
}
function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  render();
}

const TAREAS_GENERALES_DEFAULT = [
  "KOM",
  "Presentación de pólizas",
  "Presentación PIE Preliminar",
  "Listado de documentos"
];

function buildTareasGeneralesDefault() {
  return TAREAS_GENERALES_DEFAULT.map(t => ({
    id: uid(), text: t, done: false, fecha_inicio: "", fecha_fin: "", responsable: ""
  }));
}

function addOC() {
  const num = prompt("N° de Orden de Compra (ej: OC-2026-0001):");
  if (!num) return;
  const proy = prompt("N° de Proyecto (opcional):") || "";
  data.ocs.push({
    id: uid(),
    numero: num.trim(),
    proyecto: proy.trim(),
    proveedor: "",
    fecha: "",
    collapsed: false,
    tareasGenerales: buildTareasGeneralesDefault(),
    ots: []
  });
  save();
}

function deleteOC(id) {
  if (!confirm("¿Eliminar esta OC y todas sus OTs/tareas?")) return;
  data.ocs = data.ocs.filter(o => o.id !== id);
  save();
}

function addOT(ocId) {
  const num = prompt("N° de OT (ej: OT-001):");
  if (!num) return;
  const oc = data.ocs.find(o => o.id === ocId);
  if (!oc) return;
  oc.ots.push({
    id: uid(),
    numero: num.trim(),
    modulo: "",
    pl_aesa: "",
    pl_cliente: "",
    estado_aprobacion: "Pendiente",
    pie: "",
    pie_estado_aprobacion: "Pendiente",
    tareas: []
  });
  save();
}

function deleteOT(ocId, otId) {
  if (!confirm("¿Eliminar esta OT y sus tareas?")) return;
  const oc = data.ocs.find(o => o.id === ocId);
  oc.ots = oc.ots.filter(o => o.id !== otId);
  save();
}

function addTaskGeneral(ocId, text) {
  if (!text || !text.trim()) return;
  const oc = data.ocs.find(o => o.id === ocId);
  oc.tareasGenerales.push({ id: uid(), text: text.trim(), done: false, fecha_inicio: "", fecha_fin: "", responsable: "" });
  save();
}

function addTaskOT(ocId, otId, text) {
  if (!text || !text.trim()) return;
  const oc = data.ocs.find(o => o.id === ocId);
  const ot = oc.ots.find(o => o.id === otId);
  ot.tareas.push({ id: uid(), text: text.trim(), done: false, fecha_inicio: "", fecha_fin: "", responsable: "" });
  save();
}

function deleteTask(ocId, otId, taskId) {
  const oc = data.ocs.find(o => o.id === ocId);
  if (otId) {
    const ot = oc.ots.find(o => o.id === otId);
    ot.tareas = ot.tareas.filter(t => t.id !== taskId);
  } else {
    oc.tareasGenerales = oc.tareasGenerales.filter(t => t.id !== taskId);
  }
  save();
}

function toggleTask(ocId, otId, taskId) {
  const oc = data.ocs.find(o => o.id === ocId);
  const list = otId ? oc.ots.find(o => o.id === otId).tareas : oc.tareasGenerales;
  const t = list.find(x => x.id === taskId);
  t.done = !t.done;
  save();
}

function updateField(path, value) {
  // path: array describing where to write
  let ref = data;
  for (let i = 0; i < path.length - 1; i++) ref = ref[path[i]];
  ref[path[path.length - 1]] = value;
  // do NOT re-render on every keystroke; only save
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  updateStats();
  updateProgressBadges();
}

function toggleCollapse(ocId) {
  const oc = data.ocs.find(o => o.id === ocId);
  oc.collapsed = !oc.collapsed;
  save();
}

function progressOC(oc) {
  let total = oc.tareasGenerales.length;
  let done = oc.tareasGenerales.filter(t => t.done).length;
  oc.ots.forEach(ot => {
    total += ot.tareas.length;
    done += ot.tareas.filter(t => t.done).length;
  });
  return { total, done, pct: total === 0 ? 0 : Math.round((done/total)*100) };
}

function updateStats() {
  let ocCount = data.ocs.length;
  let otCount = 0, total = 0, done = 0;
  data.ocs.forEach(oc => {
    otCount += oc.ots.length;
    total += oc.tareasGenerales.length;
    done += oc.tareasGenerales.filter(t => t.done).length;
    oc.ots.forEach(ot => {
      total += ot.tareas.length;
      done += ot.tareas.filter(t => t.done).length;
    });
  });
  const pct = total === 0 ? 0 : Math.round((done/total)*100);
  document.getElementById("stats").innerHTML = `
    <div class="stat"><div class="num">${ocCount}</div><div class="lbl">OCs</div></div>
    <div class="stat"><div class="num">${otCount}</div><div class="lbl">OTs</div></div>
    <div class="stat"><div class="num">${done}/${total}</div><div class="lbl">Tareas hechas</div></div>
    <div class="stat"><div class="num">${pct}%</div><div class="lbl">Avance general</div></div>
  `;
}

function updateProgressBadges() {
  data.ocs.forEach(oc => {
    const p = progressOC(oc);
    const el = document.querySelector(`[data-oc-progress="${oc.id}"]`);
    if (el) el.textContent = `${p.done}/${p.total} · ${p.pct}%`;
    oc.ots.forEach(ot => {
      const total = ot.tareas.length;
      const done = ot.tareas.filter(t => t.done).length;
      const pct = total === 0 ? 0 : Math.round((done/total)*100);
      const eot = document.querySelector(`[data-ot-progress="${ot.id}"]`);
      if (eot) eot.textContent = `${done}/${total} · ${pct}%`;
    });
  });
}

function taskRow(task, ocId, otId) {
  return `
    <li class="task ${task.done ? 'done' : ''}">
      <input type="checkbox" ${task.done ? 'checked' : ''}
        onchange="toggleTask('${ocId}', ${otId ? `'${otId}'` : 'null'}, '${task.id}')">
      <input type="text" value="${escapeHtml(task.text)}"
        oninput="updateField(${getPathStr(ocId, otId, task.id, 'text')}, this.value)">
      <div class="task-field">
        <label>Responsable</label>
        <input type="text" placeholder="—" value="${escapeHtml(task.responsable || '')}"
          oninput="updateField(${getPathStr(ocId, otId, task.id, 'responsable')}, this.value)">
      </div>
      <div class="task-field">
        <label>Fecha inicio</label>
        <input type="date" value="${task.fecha_inicio || ''}"
          oninput="updateField(${getPathStr(ocId, otId, task.id, 'fecha_inicio')}, this.value)">
      </div>
      <div class="task-field">
        <label>Fecha fin</label>
        <input type="date" value="${task.fecha_fin || ''}"
          oninput="updateField(${getPathStr(ocId, otId, task.id, 'fecha_fin')}, this.value)">
      </div>
      <button class="btn-danger btn-small" onclick="deleteTask('${ocId}', ${otId ? `'${otId}'` : 'null'}, '${task.id}')" title="Eliminar">×</button>
    </li>
  `;
}

function getPathStr(ocId, otId, taskId, field) {
  const ocIdx = data.ocs.findIndex(o => o.id === ocId);
  if (otId) {
    const otIdx = data.ocs[ocIdx].ots.findIndex(o => o.id === otId);
    const tIdx = data.ocs[ocIdx].ots[otIdx].tareas.findIndex(t => t.id === taskId);
    return `['ocs', ${ocIdx}, 'ots', ${otIdx}, 'tareas', ${tIdx}, '${field}']`;
  } else {
    const tIdx = data.ocs[ocIdx].tareasGenerales.findIndex(t => t.id === taskId);
    return `['ocs', ${ocIdx}, 'tareasGenerales', ${tIdx}, '${field}']`;
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function estadoAprobClass(v) {
  const m = { 'Pendiente':'pendiente', 'En Revisión':'revision', 'Aprobado':'aprobado',
              'Observado':'observado', 'Rechazado':'rechazado' };
  return m[v] || 'pendiente';
}

function render() {
  updateStats();
  const c = document.getElementById("container");
  if (data.ocs.length === 0) {
    c.innerHTML = `<div class="empty">No hay órdenes de compra todavía.<br>Hacé clic en <b>+ Nueva OC</b> para empezar.</div>`;
    return;
  }
  c.innerHTML = data.ocs.map((oc, ocIdx) => {
    const p = progressOC(oc);
    return `
      <div class="oc">
        <div class="oc-head ${oc.collapsed ? 'collapsed' : ''}">
          <span class="toggle" onclick="toggleCollapse('${oc.id}')">▼</span>
          <input class="title" value="${escapeHtml(oc.numero)}"
            oninput="updateField(['ocs', ${ocIdx}, 'numero'], this.value)">
          <input class="title" style="flex:0 1 170px; font-size:13px; font-weight:600; opacity:.95"
            placeholder="N° Proyecto" value="${escapeHtml(oc.proyecto || '')}"
            oninput="updateField(['ocs', ${ocIdx}, 'proyecto'], this.value)">
          <input class="title" style="flex:0 1 200px; font-size:13px; font-weight:500; opacity:.9"
            placeholder="Proveedor" value="${escapeHtml(oc.proveedor || '')}"
            oninput="updateField(['ocs', ${ocIdx}, 'proveedor'], this.value)">
          <input type="date" value="${oc.fecha || ''}" style="font-size:12px"
            oninput="updateField(['ocs', ${ocIdx}, 'fecha'], this.value)">
          <span class="progress" data-oc-progress="${oc.id}">${p.done}/${p.total} · ${p.pct}%</span>
          <button class="btn-danger btn-small" onclick="deleteOC('${oc.id}')" title="Eliminar OC">🗑</button>
        </div>
        <div class="oc-body ${oc.collapsed ? 'hidden' : ''}">

          <div class="section-title">📌 Tareas generales</div>
          <ul class="task-list">
            ${oc.tareasGenerales.map(t => taskRow(t, oc.id, null)).join('')}
          </ul>
          <div class="add-row">
            <input type="text" placeholder="+ Agregar tarea general (Enter para guardar)"
              onkeypress="if(event.key==='Enter'){addTaskGeneral('${oc.id}', this.value); this.value='';}">
          </div>

          <div class="section-title" style="margin-top:18px">
            🔧 Órdenes de trabajo
            <button class="btn-secondary btn-small" onclick="addOT('${oc.id}')">+ Nueva OT</button>
          </div>

          ${oc.ots.map((ot, otIdx) => {
            const total = ot.tareas.length;
            const done = ot.tareas.filter(t => t.done).length;
            const pct = total === 0 ? 0 : Math.round((done/total)*100);
            return `
              <div class="ot">
                <div class="ot-head">
                  <input class="ot-title" value="${escapeHtml(ot.numero)}"
                    oninput="updateField(['ocs', ${ocIdx}, 'ots', ${otIdx}, 'numero'], this.value)">
                  <input class="ot-title" style="font-weight:500; font-size:13px; color:#475569"
                    placeholder="Módulo / descripción" value="${escapeHtml(ot.modulo || '')}"
                    oninput="updateField(['ocs', ${ocIdx}, 'ots', ${otIdx}, 'modulo'], this.value)">
                  <span class="ot-progress" data-ot-progress="${ot.id}">${done}/${total} · ${pct}%</span>
                  <button class="btn-danger btn-small" onclick="deleteOT('${oc.id}', '${ot.id}')" title="Eliminar OT">×</button>
                </div>
                <div class="ot-fields">
                  <div class="ot-field">
                    <label>PL AESA</label>
                    <input type="text" placeholder="N° PL AESA" value="${escapeHtml(ot.pl_aesa || '')}"
                      oninput="updateField(['ocs', ${ocIdx}, 'ots', ${otIdx}, 'pl_aesa'], this.value)">
                  </div>
                  <div class="ot-field">
                    <label>PL Cliente</label>
                    <input type="text" placeholder="N° PL Cliente" value="${escapeHtml(ot.pl_cliente || '')}"
                      oninput="updateField(['ocs', ${ocIdx}, 'ots', ${otIdx}, 'pl_cliente'], this.value)">
                  </div>
                  <div class="ot-field">
                    <label>Estado Aprobación</label>
                    <select class="estado-aprob ${estadoAprobClass(ot.estado_aprobacion)}"
                      onchange="updateField(['ocs', ${ocIdx}, 'ots', ${otIdx}, 'estado_aprobacion'], this.value); this.className='estado-aprob '+estadoAprobClass(this.value)">
                      ${['Pendiente','En Revisión','Aprobado','Observado','Rechazado']
                        .map(e => `<option value="${e}" ${ (ot.estado_aprobacion||'Pendiente')===e ? 'selected':'' }>${e}</option>`).join('')}
                    </select>
                  </div>
                  <div class="ot-field">
                    <label>PIE</label>
                    <input type="text" placeholder="N° / Ref. PIE" value="${escapeHtml(ot.pie || '')}"
                      oninput="updateField(['ocs', ${ocIdx}, 'ots', ${otIdx}, 'pie'], this.value)">
                  </div>
                  <div class="ot-field">
                    <label>Estado Aprob. PIE</label>
                    <select class="estado-aprob ${estadoAprobClass(ot.pie_estado_aprobacion)}"
                      onchange="updateField(['ocs', ${ocIdx}, 'ots', ${otIdx}, 'pie_estado_aprobacion'], this.value); this.className='estado-aprob '+estadoAprobClass(this.value)">
                      ${['Pendiente','En Revisión','Aprobado','Observado','Rechazado']
                        .map(e => `<option value="${e}" ${ (ot.pie_estado_aprobacion||'Pendiente')===e ? 'selected':'' }>${e}</option>`).join('')}
                    </select>
                  </div>
                </div>
                <ul class="task-list">
                  ${ot.tareas.map(t => taskRow(t, oc.id, ot.id)).join('')}
                </ul>
                <div class="add-row">
                  <input type="text" placeholder="+ Agregar tarea de esta OT (Enter)"
                    onkeypress="if(event.key==='Enter'){addTaskOT('${oc.id}', '${ot.id}', this.value); this.value='';}">
                </div>
              </div>
            `;
          }).join('')}

          ${oc.ots.length === 0 ? '<div style="font-size:12px; color:#9ca3af; padding:8px 0">Sin OTs todavía. Usá <b>+ Nueva OT</b>.</div>' : ''}

        </div>
      </div>
    `;
  }).join('');
}

function exportData() {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const date = new Date().toISOString().slice(0,10);
  a.href = url; a.download = `checklist_OC_OT_${date}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importData() {
  document.getElementById("fileInput").click();
}

function loadFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const imported = JSON.parse(e.target.result);
      if (!imported.ocs) throw new Error("Formato inválido");
      if (!confirm(`¿Reemplazar todos los datos actuales con el archivo? (${imported.ocs.length} OCs)`)) return;
      data = imported;
      save();
    } catch (err) {
      alert("Error al importar: " + err.message);
    }
  };
  reader.readAsText(file);
}
